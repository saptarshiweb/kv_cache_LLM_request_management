info:
  name: Submit Request
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8000/requests
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "prompt_tokens": 256,
        "max_tokens": 512,
        "priority": 2
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
